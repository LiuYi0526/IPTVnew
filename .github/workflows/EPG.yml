name: Make IPTV EPG 
on:
  # push:
  #   branches:
  #     - main
  schedule:
    - cron: "00 2 * * *"
    - cron: "20 16 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install xmltv
      run: |
        cp /usr/share/zoneinfo/Asia/Taipei /etc/localtime
        cd ./EPG
        pip3 install -r requirements.txt
    - name: Make EPG
      run: |
        cd ./EPG
        python3 ./gen_xml.py
        mkdir xml
        mv epg0.xml xml
        mv README.md xml
        mv merge_xmltv_files.py xml
    - name: Download Others EPG
      run: |
        cd ./EPG/xml

        validate_xml() {
          python3 -c "import sys, xml.etree.ElementTree as ET; root = ET.parse(sys.argv[1]).getroot(); assert root.tag == 'tv', root.tag" "$1"
        }

        download_xml() {
          url="$1"
          output="$2"
          temporary="${output}.tmp"
          rm -f "$temporary"
          if curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors --connect-timeout 15 --max-time 180 \
              --output "$temporary" "$url" \
              && validate_xml "$temporary"; then
            mv "$temporary" "$output"
          else
            echo "::warning::Unable to download a valid $output; skipping it."
            rm -f "$temporary"
          fi
        }

        download_gzip_xml() {
          url="$1"
          output="$2"
          temporary_gzip="${output}.gz.tmp"
          temporary_xml="${output}.tmp"
          rm -f "$temporary_gzip" "$temporary_xml"
          if curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors --connect-timeout 15 --max-time 180 \
              --output "$temporary_gzip" "$url" \
              && gzip -t "$temporary_gzip" \
              && gzip -dc "$temporary_gzip" > "$temporary_xml" \
              && validate_xml "$temporary_xml"; then
            mv "$temporary_xml" "$output"
          else
            echo "::warning::Unable to download a valid $output; skipping it."
            rm -f "$temporary_xml"
          fi
          rm -f "$temporary_gzip"
        }

        download_xml \
          "https://api.liuyi0526.com/gmcc_epg.xml" \
          "gmcc_epg.xml"
        download_gzip_xml \
          "https://raw.githubusercontent.com/kuke31/xmlgz/main/all.xml.gz" \
          "all.xml"
    - name: Merge EPG
      run: |
        cd ./EPG/xml
        python3 merge_xmltv_files.py
        gzip -kf EPG.xml
    # - name : Upload artifact
    #   uses: actions/upload-artifact@master
    #   with:
    #     name: allcc.xml
    #     path: allcc.xml
    - name: Git push assets to "EPG" branch
      run: |
        cd ./EPG/xml
        git init
        git config --local user.name "actions"
        git config --local user.email "action@github.com"
        git checkout -b EPG
        git add .
        git commit -m "Update EPG"
        git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
        git push -f -u origin EPG
